name: Fork Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.10)"
        required: false
        default: "0.1.10"
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build_bundle:
    name: Build JS bundle
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      ref: ${{ steps.meta.outputs.ref }}
      clerk_publishable_key: ${{ steps.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.meta.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: meta
        name: Resolve release metadata and public config
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            raw_version="${INPUT_VERSION:-0.1.10}"
            version="${raw_version#v}"
            tag="v${version}"
          fi

          is_prerelease="false"
          release_channel="stable"
          if [[ "${INPUT_PRERELEASE:-false}" == "true" || "$version" == *-* ]]; then
            is_prerelease="true"
          fi
          if [[ "$version" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            release_channel="nightly"
          fi

          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          clerk_publishable_key="$(env_example CLERK_PUBLISHABLE_KEY)"
          clerk_jwt_template="$(env_example CLERK_JWT_TEMPLATE)"
          clerk_cli_oauth_client_id="$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
          relay_url="$(env_example RELAY_URL)"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release_name=Uqori ${tag}"
            echo "is_prerelease=${is_prerelease}"
            echo "release_channel=${release_channel}"
            echo "ref=${GITHUB_SHA}"
            echo "clerk_publishable_key=${clerk_publishable_key}"
            echo "clerk_jwt_template=${clerk_jwt_template}"
            echo "clerk_cli_oauth_client_id=${clerk_cli_oauth_client_id}"
            echo "relay_url=${relay_url}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "T3CODE_CLERK_PUBLISHABLE_KEY=${clerk_publishable_key}"
            echo "T3CODE_CLERK_JWT_TEMPLATE=${clerk_jwt_template}"
            echo "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=${clerk_cli_oauth_client_id}"
            echo "T3CODE_RELAY_URL=${relay_url}"
          } >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.meta.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [build_bundle]
    if: ${{ !cancelled() && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ needs.build_bundle.outputs.ref }}
      release_channel: ${{ needs.build_bundle.outputs.release_channel }}
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      save_pnpm_store: false

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [build_bundle]
    if: ${{ !cancelled() && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ needs.build_bundle.outputs.ref }}
      release_channel: ${{ needs.build_bundle.outputs.release_channel }}
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}
      label: macOS x64
      runner: macos-15
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [build_bundle]
    if: ${{ !cancelled() && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ needs.build_bundle.outputs.ref }}
      release_channel: ${{ needs.build_bundle.outputs.release_channel }}
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [build_bundle]
    if: ${{ !cancelled() && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ needs.build_bundle.outputs.ref }}
      release_channel: ${{ needs.build_bundle.outputs.release_channel }}
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.build_bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.build_bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.build_bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.build_bundle.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  publish:
    name: Publish GitHub Release
    needs: [build_bundle, desktop_mac_arm64, desktop_mac_x64, desktop_linux_x64, desktop_win_x64]
    if: ${{ !failure() && !cancelled() && needs.build_bundle.result == 'success' && needs.desktop_mac_arm64.result == 'success' && needs.desktop_mac_x64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_win_x64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_bundle.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Prepare checksums and updater manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-assets/builder-debug.yml

          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

          for x64_manifest in release-assets/*-win-x64.yml; do
            merged_manifest="${x64_manifest%-win-x64.yml}.yml"
            mv "$x64_manifest" "$merged_manifest"
          done

          (
            cd release-assets
            archives=(t3-*.tar.gz t3-*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No CLI archives were produced." >&2
              exit 1
            fi
            sha256sum "${archives[@]}" > SHA256SUMS
            cat SHA256SUMS
          )

          ls -lh release-assets

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ needs.build_bundle.outputs.version }}
          REF: ${{ needs.build_bundle.outputs.ref }}
        run: |
          cat > release-notes.md <<EOF
          ## Uqori v${VERSION}

          Built from commit \`${REF}\` with **Cross-Project Subagent Delegation** and **Orchestrate Mode** (\`default\` / \`plan\` / \`orchestrate\`), using independent bundle ID \`com.uqori.app\`, Electron profile \`uqori-v2\`, and state directory \`~/.uqori\` so it runs side-by-side with T3 Code.

          ### Included Downloads
          - **macOS (Apple Silicon / M1–M4)**: \`Uqori-${VERSION}-arm64.dmg\` / \`.zip\` + \`t3-${VERSION}-darwin-arm64.tar.gz\`
          - **macOS (Intel)**: \`Uqori-${VERSION}-x64.dmg\` / \`.zip\`
          - **Windows (x64)**: \`Uqori-${VERSION}-x64.exe\` + \`t3-${VERSION}-win32-x64.zip\`
          - **Linux (x64)**: \`Uqori-${VERSION}-x86_64.AppImage\` / \`Uqori-${VERSION}-amd64.deb\` + \`t3-${VERSION}-linux-x64.tar.gz\`

          > **macOS 安装提示（未公证社区构建）**：将 \`Uqori.app\` 拖入 \`/Applications\` 后若提示无法打开或已损坏，请在终端执行一次：
          > \`\`\`bash
          > xattr -cr "/Applications/Uqori.app"
          > \`\`\`
          EOF
          sed -i 's/^          //' release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build_bundle.outputs.tag }}
          RELEASE_NAME: ${{ needs.build_bundle.outputs.release_name }}
          REF: ${{ needs.build_bundle.outputs.ref }}
          IS_PRERELEASE: ${{ needs.build_bundle.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$RELEASE_NAME" --notes-file release-notes.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* \
              --target "$REF" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              "${flags[@]}" \
              -R "$GITHUB_REPOSITORY"
          fi
