name: Setup APT mirrors
description: Configure Ubuntu package downloads with automatic mirror failover.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Stop background auto-upgrades on fresh GitHub-hosted Ubuntu runners so
        # they do not hold /var/lib/dpkg/lock-frontend while CI installs libraries.
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
          apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true

        # Replace both Blacksmith and GitHub-hosted mirror lists as well as direct sources.
        printf '%s\tpriority:%s\n' \
          https://mirrors.edge.kernel.org/ubuntu 1 \
          https://mirror.math.princeton.edu/pub/ubuntu 2 \
          https://archive.ubuntu.com/ubuntu 3 \
          | sudo tee /etc/apt/blacksmith-ubuntu-mirrors.txt > /dev/null
        if [ "$(dpkg --print-architecture)" = "amd64" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo cp /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/apt-mirrors.txt
        fi

        # APT's mirror transport retries each file against the next server.
        sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
          -exec sed -i -E \
          's#https?://(([^/]+\.)?archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/blacksmith-ubuntu-mirrors.txt#g' {} +

        # Skip third-party runner repos (Microsoft, Launchpad PPAs) and needrestart scans.
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' \
            -exec mv {} {}.disabled \;
        fi
        sudo rm -f /etc/apt/apt.conf.d/99needrestart

        # Move on to a fallback before an unreachable server or infinite dpkg lock exhausts the job.
        printf '%s\n' \
          'Acquire::http::Timeout "10";' \
          'Acquire::https::Timeout "10";' \
          'Acquire::Retries "1";' \
          'Acquire::ForceIPv4 "true";' \
          'DPkg::Lock::Timeout "60";' \
          'Dpkg::Use-Pty "0";' \
          | sudo tee /etc/apt/apt.conf.d/99z-mirror-timeouts > /dev/null
